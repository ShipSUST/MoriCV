<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>招行荣誉匿名拓印</title>
<style>input,textarea {width:190px} .ant-form-item {margin:8px} .ant-select,.ant-picker {display:inline-block} .ant-select-dropdown,.ant-picker-dropdown {position:fixed;top:20px;right:10px;background:white;border:1px solid;padding:10px;z-index:10} .ant-picker-cell-disabled {color:#aaa} td {padding:8px;cursor:pointer}</style>
<form id="resume"><div class="item-box"><div class="item-name">个人荣誉</div><div id="rows"></div><div class="add-item"><div class="btn-add">添加</div></div></div></form>
<script>
// Public labels and observed DOM only; no personal data or website saving.
let popup; const rows=document.getElementById('rows');
function closePopup(){popup?.remove();popup=null;}
function item(row,index,key,label,kind,selected='') {
 const id=`resume_awardList_${index}_${key}`;
 const f=document.createElement('div');f.className='ant-form-item form-item';
 const lab=document.createElement('label');lab.htmlFor=id;lab.textContent=label;f.append(lab);
 const input=document.createElement(kind==='textarea'?'textarea':'input');input.id=id;input.type=kind==='select'?'search':'text';
 if(kind==='select'){
  const select=document.createElement('div');select.className='ant-select';const selector=document.createElement('div');selector.className='ant-select-selector';
  input.readOnly=true;input.setAttribute('role','combobox');input.setAttribute('aria-controls',id+'_list');selector.append(input);
  const value=document.createElement('span');value.className='ant-select-selection-item';value.textContent=selected;selector.append(value);select.append(selector);f.append(select);
  const clear=document.createElement('span');clear.className='ant-select-clear';clear.textContent='×';clear.onmousedown=()=>{value.textContent='';input.value='';closePopup();};select.append(clear);
  const options=key==='awardType'?['奖项','专著或文献','专利']:['院校级','县市级','省区级','国家级','国际级'];
  const open=()=>{closePopup();popup=document.createElement('div');popup.className='ant-select-dropdown';const list=document.createElement('div');list.id=id+'_list';list.setAttribute('role','listbox');popup.append(list);for(const text of options){const option=document.createElement('div');option.className='ant-select-item-option';option.textContent=text;option.onclick=()=>{value.textContent=text;input.value='';closePopup();};list.append(option);}document.body.append(popup);};
  selector.onmousedown=open; selector.onclick=open;
 }else if(kind==='month'){
  const picker=document.createElement('div');picker.className='ant-picker time-cell';input.readOnly=true;picker.append(input);
  const clear=document.createElement('span');clear.className='ant-picker-clear';clear.textContent='×';clear.onmouseup=()=>{input.value='';closePopup();};picker.append(clear);f.append(picker);
  input.onmouseup=()=>{closePopup();popup=document.createElement('div');popup.className='ant-picker-dropdown';document.body.append(popup);let year=2026,decade=2020;
   const months=()=>{popup.innerHTML='<div class="ant-picker-month-panel"></div>';const panel=popup.firstChild;const y=document.createElement('button');y.type='button';y.className='ant-picker-year-btn';y.textContent=year+'年';y.onclick=years;panel.append(y);const table=document.createElement('table');panel.append(table);for(let month=1;month<=12;month++){const td=document.createElement('td');td.title=`${year}-${String(month).padStart(2,'0')}`;td.className='ant-picker-cell ant-picker-cell-in-view'+(year>2026||year===2026&&month>10?' ant-picker-cell-disabled':'');td.textContent=month+'月';td.onclick=()=>{if(td.classList.contains('ant-picker-cell-disabled'))return;input.value=CmbFixture.wrongMonthOnce||CmbFixture.wrongMonthAlways?'2000-01':td.title;CmbFixture.wrongMonthOnce=false;closePopup();};table.append(td);}};
   const years=()=>{popup.innerHTML='<div class="ant-picker-year-panel"></div>';const panel=popup.firstChild;const header=document.createElement('span');header.className='ant-picker-decade-btn';header.textContent=decade+'-'+(decade+9);panel.append(header);for(const step of [-10,10]){const b=document.createElement('button');b.type='button';b.className=step<0?'ant-picker-header-super-prev-btn':'ant-picker-header-super-next-btn';b.onclick=()=>{decade+=step;years();};panel.append(b);}const table=document.createElement('table');panel.append(table);for(let n=decade;n<decade+10;n++){const td=document.createElement('td');td.title=String(n);td.className='ant-picker-cell ant-picker-cell-in-view';td.textContent=n;td.onclick=()=>{year=n;months();};table.append(td);}};months();};
 }else f.append(input);
 row.append(f);return input;
}
function add(kind='奖项'){
 const index=rows.children.length;const row=document.createElement('div');
 item(row,index,'awardType','荣誉类型','select',kind);
 if(kind==='奖项'){item(row,index,'awardName','奖项名称','text');item(row,index,'awardLevel','获奖级别','select');item(row,index,'awardDate','获奖时间','month');}
 else {item(row,index,'awardName',kind==='专利'?'专利成果名称':'专著或文献名称','text');item(row,index,'awardIdentification',kind==='专利'?'专利号':'出版书号或期刊名称','text');item(row,index,'description','详细说明','textarea');}
 const remove=document.createElement('div');remove.className='remove-item';remove.textContent='删除';row.append(remove);rows.append(row);return row;
}
document.querySelector('.btn-add').onclick=()=>add();
document.addEventListener('keydown',e=>{if(e.which===27||e.keyCode===27)closePopup();});
globalThis.CmbFixture={reset(){closePopup();this.wrongMonthOnce=false;this.wrongMonthAlways=false;rows.replaceChildren();add('专著或文献');add('奖项');add('专利');add('奖项');},add,closePopup};CmbFixture.reset();
globalThis.chrome={runtime:{onMessage:{addListener(fn){globalThis.__resumeHelperListener=fn;}}}};
</script>
<script src="/src/shared/matcher-core.js"></script><script src="/src/shared/category-runtime.js"></script>
<script>if(location.hostname!=='127.0.0.1')throw Error('Anonymous localhost only');ResumeHelperCore.detectSite=()=> 'cmbchina';</script>
<script src="/src/content/fill.js"></script>
<script type="module">import {runCmb} from '/cmb-scenarios.js';globalThis.__recordRunner=runCmb().then(result=>{globalThis.__recordProgress=result;return result;}).catch(error=>({error:error.stack,checks:globalThis.__recordProgress?.checks||[]}));</script>
</html>
