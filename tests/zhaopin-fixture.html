    .el-picker-panel a.cell { display: block; padding: 6px; }
    .prev-month, .next-month, .disabled { color: #bdc5ca; }
    .disabled { cursor: not-allowed !important; }
    .available:hover, a.cell:hover { background: #e3f2fd; }
    .el-dialog__wrapper { position: fixed; inset: 0; z-index: 50; background: #0005; display: grid; place-items: center; }
    .el-dialog { width: 560px; padding: 18px; background: white; }
    .s-region__levels { display: flex; gap: 8px; min-height: 170px; }
    .s-region__level { flex: 1; border: 1px solid #ddd; padding: 8px; }
    .s-region__option { display: block; width: 100%; margin: 3px 0; }
    .saved-card { padding: 8px; border-bottom: 1px solid #ddd; }
    .fixture-banner { background: #f1f5f9; padding: 10px; }
  </style>
</head>
