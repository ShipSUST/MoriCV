<!doctype html>
<html lang="zh-CN" data-resume-helper-fixture="zhiye">
<head>
  <meta charset="utf-8">
  <title>Zhiye Phoenix Fixture</title>
  <style>
    body { font-family: sans-serif; padding: 24px; }
    .section-title { font-size: 22px; font-weight: 700; margin-top: 24px; }
    .form { border: 1px solid #ddd; margin: 10px 0; padding: 12px; }
    .form-item { margin: 8px 0; }
    label { display: inline-block; width: 130px; }
    input, textarea { width: 320px; }
    .phoenix-select { display: inline-block; }
    .phoenix-select__dropdown { background: white; border: 1px solid #888; position: absolute; z-index: 10; }
    .phoenix-select__dropdown li { cursor: pointer; list-style: none; padding: 4px 10px; }
    .common-unmodeled-layer { background: white; border: 1px solid #888; padding: 8px; position: fixed; right: 20px; top: 20px; z-index: 20; }
    .phoenix-calendar-month-panel-table, .phoenix-calendar-year-panel-table { border-collapse: collapse; }
    .phoenix-calendar-month-panel-cell, .phoenix-calendar-year-panel-cell { cursor: pointer; padding: 6px 10px; }
    .phoenix-calendar-header, .phoenix-calendar-year-panel-header { display: flex; gap: 8px; margin-bottom: 6px; }
    .phoenix-select__clearIcon { cursor: pointer; display: none; margin-left: 4px; }
    .phoenix-select__clearIcon--show { display: inline; }
    .choice { margin-right: 12px; cursor: pointer; }
    .choice:has(input:checked) { color: green; font-weight: 700; }
    [id$="_addButton"] { color: blue; cursor: pointer; margin: 8px 0; }
  </style>
</head>
<body>
  <div class="section-title" id="zhiye-basic">个人信息</div>
  <div class="form" id="zhiye-basic">
    <div class="form-item"><label>姓名</label><input class="phoenix-input__input" type="text"></div>
    <div class="form-item"><label>手机号码</label><input class="phoenix-input__input" type="text"></div>
    <div class="form-item"><label>邮箱</label><input class="phoenix-input__input" type="text"></div>
    <div class="form-item"><label>性别</label><label class="choice"><input type="radio" name="gender" value="男">男</label><label class="choice"><input type="radio" name="gender" value="女">女</label><label class="choice"><input type="radio" name="gender" value="保密">保密</label></div>
    <div class="form-item"><label>出生日期</label><span class="phoenix-select"><input class="phoenix-select__input" type="text"></span></div>
    <div class="form-item"><label>证件号码</label><input class="phoenix-input__input" type="text"></div>
    <div class="form-item"><label>证件照</label><input type="file"></div>
  </div>

  <div class="section-title" id="zhiye-intent">求职意向</div>
  <div class="form" id="zhiye-intent">
    <div class="form-item"><label>期望从事职业</label><span class="phoenix-select"><input class="phoenix-select__input" type="text"></span></div>
    <div class="form-item"><label>期望工作城市</label><span class="phoenix-select"><input class="phoenix-select__input" type="text"></span></div>
  </div>

  <div class="section-title" id="zhiye-education">教育经历</div>
  <div id="education-records"></div>
  <div id="zhiye-education_addButton">添加教育经历</div>

  <div class="section-title" id="zhiye-work">工作经历</div>
  <div id="work-records"></div>
  <div id="zhiye-work_addButton">添加工作经历</div>

  <div class="section-title" id="zhiye-project">项目经历</div>
  <div id="project-records"></div>
  <div id="zhiye-project_addButton">添加项目经历</div>

  <pre id="events"></pre>
  <script>
    const ids = { education: "zhiye-education", work: "zhiye-work", project: "zhiye-project" };
    const phoenixMode = new URLSearchParams(location.search).get("phoenix") || "";
    function field(label, control) {
      return `<div class="form-item"><div class="form-item__title"><label>${label}</label></div><div class="form-item__control">${control}</div></div>`;
    }
    function input(className = "phoenix-input__input") {
      return `<input class="${className}" type="text">`;
    }
    function select(options = "") {
      return `<span class="phoenix-select"><input class="phoenix-select__input" type="text" data-options="${options}"><span class="phoenix-select__clearIcon phoenix-select__clearIcon--show">清除</span></span>`;
    }
    function monthSelect() {
      return `<span class="phoenix-select" data-month-picker="true"><span class="phoenix-select__calcEle"></span><div class="phoenix-select__placeHolder phoenix-select__placeHolder--show">请选择</div><input class="phoenix-select__input phoenix-select__input--unText" type="text" data-committed=""><span class="phoenix-select__clearIcon">清除</span></span>`;
    }
    function record(kind) {
      const form = document.createElement("div");
      form.className = "form";
      form.id = ids[kind];
      if (kind === "education") {
        form.innerHTML = field("学校名称", input()) + field("专业名称", input())
          + field("学历", select("本科|硕士研究生|博士研究生"))
          + field("学位", select("学士|硕士|博士")) + field("院系名称", input())
          + field("开始时间", monthSelect()) + field("结束时间", monthSelect());
      } else if (kind === "work") {
        form.innerHTML = field("公司名称", input()) + field("职位名称", input())
          + field("开始时间", monthSelect()) + field("结束时间", `${monthSelect()}<input class="phoenix-checkbox__input" type="checkbox"><span>至今</span>`)
          + field("工作职责", `<textarea class="phoenix-textarea__realTextarea"></textarea>`);
      } else {
        form.innerHTML = field("项目名称", input()) + field("职务", input())
          + field("开始时间", monthSelect()) + field("结束时间", `${monthSelect()}<input class="phoenix-checkbox__input" type="checkbox"><span>至今</span>`)
          + field("项目描述", `<textarea class="phoenix-textarea__realTextarea"></textarea>`);
      }
      const remove = document.createElement("button"); remove.type = "button"; remove.textContent = "删除";
      remove.addEventListener("click", () => form.remove()); form.append(remove);
      return form;
    }
    function addRecord(kind) {
      document.querySelector(`#${kind}-records`).append(record(kind));
    }
    addRecord("education");
    addRecord("work");
    addRecord("project");
    document.querySelector("#zhiye-education_addButton").addEventListener("click", () => addRecord("education"));
    document.querySelector("#zhiye-work_addButton").addEventListener("click", () => addRecord("work"));
    document.querySelector("#zhiye-project_addButton").addEventListener("click", () => addRecord("project"));

    window.monthPickerCommitCount = 0;
    window.monthPickerLayerId = 0;
    function closeDropdown() { document.querySelector(".phoenix-select__dropdown")?.remove(); }
    function closeMonthPicker() { document.querySelectorAll(".common-unmodeled-layer:not([data-stale])").forEach((layer) => layer.remove()); }
    function syncMonthValue(root, value) {
      const input = root.querySelector("input");
      input.value = phoenixMode.includes("display") ? "" : value;
      input.dataset.committed = value;
      const shown = value && phoenixMode.includes("chinese") ? `${value.slice(0,4)}年${Number(value.slice(5))}月` : value;
      root.querySelector(".phoenix-select__calcEle").textContent = phoenixMode.includes("placeholder") ? "" : shown;
      const placeholder = root.querySelector(".phoenix-select__placeHolder");
      placeholder.textContent = shown || "请选择";
      placeholder.classList.toggle("phoenix-select__placeHolder--show", !value);
      root.querySelector(".phoenix-select__clearIcon").classList.toggle("phoenix-select__clearIcon--show", Boolean(value));
    }
    function commitMonth(root, value) {
      const input = root.querySelector("input");
      root.dataset.committing = "true";
      syncMonthValue(root, value);
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.dispatchEvent(new Event("change", { bubbles: true }));
      const replacement = input.cloneNode(true);
      input.replaceWith(replacement);
      delete root.dataset.committing;
      window.monthPickerCommitCount += 1;
      closeMonthPicker();
    }
    function showMonthPicker(root) {
      closeMonthPicker();
      const committedYear = Number((root.querySelector("input").dataset.committed || "").slice(0, 4));
      let viewYear = committedYear || 2026;
      const layer = document.createElement("div");
      layer.id = `fixture-calendar-${++window.monthPickerLayerId}`;
      root.setAttribute("aria-controls", layer.id);
      layer.className = "common-unmodeled-layer common-unmodeled-layer-placement-bottomLeft";
      layer.innerHTML = `<div class="phoenix-date-picker"><div class="phoenix-calendar phoenix-calendar-month-calendar" tabindex="0"></div></div>`;
      const calendar = layer.querySelector(".phoenix-calendar");
      function renderMonths() {
        calendar.innerHTML = `<div class="phoenix-calendar-header"><a class="phoenix-calendar-year-select" role="button">${viewYear}年</a></div><table class="phoenix-calendar-month-panel-table" role="grid"><tbody>${[0, 1, 2, 3].map(row => `<tr role="row">${[1, 2, 3].map(column => row * 3 + column).map(month => `<td class="phoenix-calendar-month-panel-cell" role="gridcell"><a class="phoenix-calendar-month-panel-month">${month}月</a></td>`).join("")}</tr>`).join("")}</tbody></table>`;
        calendar.querySelector(".phoenix-calendar-year-select").addEventListener("click", (event) => {
          event.stopPropagation();
          renderYears();
        });
        calendar.querySelectorAll(".phoenix-calendar-month-panel-cell").forEach((cell, index) => {
          if (phoenixMode.includes("disabled") && index === 8) {
            cell.classList.add("phoenix-calendar-month-panel-cell-disabled"); cell.setAttribute("aria-disabled", "true"); return;
          }
          cell.addEventListener("mousedown", (event) => {
            event.stopPropagation();
            commitMonth(root, `${viewYear}-${String(index + 1).padStart(2, "0")}`);
          });
        });
      }
      function renderYears() {
        const decadeStart = Math.floor(viewYear / 10) * 10;
        const years = Array.from({ length: 12 }, (_, index) => decadeStart - 1 + index);
        calendar.innerHTML = `<div class="phoenix-calendar-header"><a class="phoenix-calendar-year-select" role="button">${viewYear}年</a><a class="phoenix-calendar-month-select" role="button">9月</a></div><div class="phoenix-calendar-year-panel"><div class="phoenix-calendar-year-panel-header"><a class="phoenix-calendar-year-panel-prev-decade-btn" role="button">上一组</a><span class="phoenix-calendar-year-panel-decade-select-content">${decadeStart}-${decadeStart + 9}</span><a class="phoenix-calendar-year-panel-next-decade-btn" role="button">下一组</a></div><table class="phoenix-calendar-year-panel-table" role="grid"><tbody>${[0, 1, 2, 3].map(row => `<tr role="row">${years.slice(row * 3, row * 3 + 3).map(year => `<td class="phoenix-calendar-year-panel-cell" role="gridcell"><a class="phoenix-calendar-year-panel-year">${year}</a></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
        calendar.querySelector(".phoenix-calendar-year-select").addEventListener("click", (event) => { event.stopPropagation(); renderYears(); });
        calendar.querySelector(".phoenix-calendar-month-select").addEventListener("click", (event) => { event.stopPropagation(); renderMonths(); });
        calendar.querySelector(".phoenix-calendar-year-panel-prev-decade-btn").addEventListener("click", (event) => { event.stopPropagation(); viewYear = decadeStart - 10; renderYears(); });
        calendar.querySelector(".phoenix-calendar-year-panel-next-decade-btn").addEventListener("click", (event) => { event.stopPropagation(); viewYear = decadeStart + 10; renderYears(); });
        calendar.querySelectorAll(".phoenix-calendar-year-panel-year").forEach((year) => {
          year.addEventListener("click", (event) => { event.stopPropagation(); viewYear = Number(year.textContent); renderYears(); });
        });
      }
      renderMonths();
      if (phoenixMode.includes("delay")) setTimeout(() => document.body.append(layer), 120);
      else document.body.append(layer);
      if (phoenixMode.includes("residual") && !document.querySelector("[data-stale]")) {
        const stale = layer.cloneNode(true); stale.id = "stale-calendar"; stale.dataset.stale = "true";
        stale.style.left = "0px"; stale.style.right = "auto"; document.body.append(stale);
      }
    }
    document.addEventListener("click", (event) => {
      const choice = event.target.closest(".choice");
      if (choice) {
        return;
      }
      const clear = event.target.closest(".phoenix-select__clearIcon");
      if (clear) {
        if (!clear.closest('[data-month-picker]')) { clear.closest('.phoenix-select').querySelector('input').value = ''; return; }
        event.stopPropagation();
        commitMonth(clear.closest("[data-month-picker]"), "");
        return;
      }
      const selectRoot = event.target.closest(".phoenix-select");
      if (!selectRoot) return;
      if (selectRoot.matches("[data-month-picker]")) {
        showMonthPicker(selectRoot);
        return;
      }
      const target = selectRoot.querySelector("input");
      const options = (target.dataset.options || "").split("|").filter(Boolean);
      closeDropdown();
      if (!options.length) return;
      const list = document.createElement("ul");
      list.className = "phoenix-select__dropdown";
      for (const value of options) {
        const item = document.createElement("li");
        item.textContent = value;
        item.setAttribute("role", "option");
        item.addEventListener("click", (optionEvent) => {
          optionEvent.stopPropagation();
          target.value = value;
          target.dispatchEvent(new Event("input", { bubbles: true }));
          target.dispatchEvent(new Event("change", { bubbles: true }));
          closeDropdown();
        });
        list.append(item);
      }
      document.body.append(list);
    });
    document.addEventListener("input", (event) => {
      const monthRoot = event.target.closest?.("[data-month-picker]");
      if (monthRoot && !monthRoot.dataset.committing) {
        setTimeout(() => syncMonthValue(monthRoot, event.target.dataset.committed || ""), 0);
      }
      if (event.target.matches("input,textarea")) document.querySelector("#events").textContent += `input:${event.target.value}\n`;
    });
    document.addEventListener("change", (event) => {
      if (event.target.matches("input,textarea")) document.querySelector("#events").textContent += `change:${event.target.value}\n`;
    });
  </script>
</body>
</html>
